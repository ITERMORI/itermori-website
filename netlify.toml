[build]
  publish = "."
  command = "echo 'Static site - nothing to build'"

# itermori.com/admin opens the editing panel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
